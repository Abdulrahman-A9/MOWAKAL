<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ملف المحامي | MOWAKAL</title>
  <link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="../css/reset.css"><link rel="stylesheet" href="../css/global.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/public.css"><link rel="stylesheet" href="../css/dashboard.css"><link rel="stylesheet" href="../css/client.css"><link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-page="lawyer-profile" data-path-prefix="../">
  <div id="publicHeader"></div>
  <main class="section listing-page"><div class="container" data-lawyer-profile><div class="empty-state"><h3>جارٍ تحميل الملف</h3><p>لحظات ونجهز لك التفاصيل المهنية.</p></div></div></main>
  <div class="modal-backdrop" id="consultationModal" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="consultation-title"><div class="modal__header"><div><h2 id="consultation-title">طلب استشارة</h2><p>اكتب نبذة قصيرة تساعد المحامي على فهم احتياجك.</p></div><button class="modal__close" type="button" aria-label="إغلاق" data-modal-close>×</button></div><div class="modal__body"><form class="auth-form" data-consultation-form><div class="field"><label for="consultation-subject">موضوع الاستشارة</label><input class="input" id="consultation-subject" name="subject" type="text" placeholder="مثال: مراجعة عقد شراكة" required></div><div class="field"><label for="consultation-description">وصف مختصر للحالة</label><textarea class="textarea" id="consultation-description" name="description" placeholder="اذكر المعلومات الأساسية التي تريد من المحامي الاطلاع عليها" required></textarea></div><div class="form-grid"><div class="field"><label for="consultation-date">التاريخ المفضل</label><input class="input" id="consultation-date" name="date" type="date" required></div><div class="field"><label for="consultation-time">الوقت المفضل</label><input class="input" id="consultation-time" name="time" type="time" required></div></div><button class="button button--primary button--block" type="submit">إرسال طلب الاستشارة</button></form></div></section></div>
  <script src="../js/mock-data.js"></script><script src="../js/ui.js"></script><script src="../js/navigation.js"></script><script src="../js/lawyers.js"></script><script src="../js/main.js"></script>
</body>
</html>
