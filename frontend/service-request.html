<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="أرسل طلب خدمتك القانونية عبر خطوات واضحة في MOWAKAL.">
  <title>طلب خدمة قانونية | MOWAKAL</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/public.css">
  <link rel="stylesheet" href="css/platform.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="service-request" data-path-prefix="">
  <div id="publicHeader"></div>
  <main class="section public-request-page">
    <div class="container">
      <nav class="public-breadcrumb" aria-label="مسار الصفحة"><a href="index.html">الرئيسية</a><span aria-hidden="true">/</span><a href="index.html#services">الخدمات</a><span aria-hidden="true">/</span><span aria-current="page">طلب خدمة</span></nav>
      <header class="public-request-heading">
        <span class="eyebrow">طلب قانوني بخطوات واضحة</span>
        <h1>ابدأ طلب خدمتك القانونية</h1>
        <p>أخبرنا بما تحتاج إليه، وسجّل التفاصيل التي تساعد على توجيه طلبك بالشكل المناسب.</p>
      </header>
      <section class="card card--padded public-request-card" aria-label="نموذج طلب الخدمة">
        <div class="wizard-steps" data-request-progress aria-label="مراحل الطلب"></div>
        <form data-public-request novalidate>
          <div data-request-steps></div>
          <div class="wizard-actions public-request-actions">
            <button type="button" class="button button--outline" data-request-back hidden>السابق</button>
            <button type="button" class="button button--primary" data-request-next>التالي</button>
          </div>
        </form>
        <div class="public-request-success" data-request-success hidden aria-live="polite"></div>
      </section>
      <p class="public-request-footnote">راجع تفاصيل طلبك في المرحلة الأخيرة قبل إكمال الخطوات.</p>
    </div>
  </main>
  <footer class="public-footer"><div class="container public-footer__inner"><a class="brand" href="index.html"><span class="brand__mark" aria-hidden="true">م</span><span class="brand__copy"><strong>MOWAKAL</strong><small>منصة الخدمات القانونية</small></span></a><p>© <span data-year></span> MOWAKAL. وضوح قانوني يبدأ من هنا.</p></div></footer>
  <script src="js/mock-data.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/public-request.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
